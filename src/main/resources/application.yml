#file: noinspection SpellCheckingInspection
logging:
  config: "classpath:logback-spring.xml"
  level:
    org.springframework.beans: debug
    org.springframework.context: debug
server:
  port: 8080
spring:
  profiles:
    active: production
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000
  jpa:
    # 关闭 Open Entity Manager in View。
    # 开启时 Spring 会把 Hibernate Session 一直保持到 HTTP 请求结束，
    # 整个请求期间数据库连接都被占住；配合 N+1 查询很容易打满 Hikari 连接池
    # （maximum-pool-size: 30）。
    # 关闭后所有返回给前端的关联字段都必须在 Service 层内加载完毕，
    # 因此 UserEntity/RoleEntity/ContractEntity/DeviceEntity/BomEntity/StructureEntity
    # 的多对多关联均为 EAGER。
    # 回归验证见 OpenInViewVerifyTest：一旦有人改回 true 或把关联改回 LAZY，该用例会失败
    open-in-view: false
    database-platform: "org.hibernate.dialect.MySQL8Dialect"
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        column_ordering_strategy: "legacy"
  mail:
    properties:
      mail:
        smtp:
          # 开启SMTP身份验证
          auth: true
          ssl:
            # 启用SSL加密传输
            enable: true
          # 使用SSL Socket Factory
          socketFactory-class: "javax.net.ssl.SSLSocketFactory"
          socketFactory-fallback: false
          starttls:
            # 不需要StartTLS
            enable: false
  web:
    resources:
      add-mappings: false
  mvc:
    view:
      suffix: ".html"
      prefix: /
airpower:
  websocket:
    support: redis
  api:
    access-token-secret: "1234567890123456789012345678901234567890"
    request-log: true
    response-log: true
  redis:
    prefix: "spms:"
  curd:
    base-package-name: "cn.hamm.spms"
    permission-with-package: true